server:
  address: 0.0.0.0  # 监听所有地址
  port: 8080

spring:
  application:
    name: trip-craft-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 是 Java 字符集名：Connector/J 将 UTF-8/utf8 与 MySQL 服务端的 utf8mb4 协商对接
    url: jdbc:mysql://localhost:3306/trip_craft?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis-plus:
  configuration:
    # 数据库下划线字段自动映射为驼峰属性
    map-underscore-to-camel-case: true
  global-config:
    banner: false
